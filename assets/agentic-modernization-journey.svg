<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Agentic modernization journey</title>
  <desc id="desc">A five-stage agentic modernization cycle of discover, decide, transform, validate, and scale, guided by infrastructure architects and producing secure, resilient, observable, and cost-aware outcomes.</desc>

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#203146" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="cycleArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#41d9c4"/>
    </marker>
  </defs>

  <rect width="1200" height="700" fill="#0b1422"/>
  <rect width="1200" height="700" fill="url(#grid)" opacity="0.62"/>
  <path d="M0 116H1200 M0 583H1200" stroke="#2a3f57" stroke-width="1"/>
  <rect x="0" y="0" width="10" height="700" fill="#41d9c4"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="60" y="57" fill="#f3f8fc" font-size="34" font-weight="700">Modernize with Confidence</text>
    <text x="60" y="91" fill="#8fa8bf" font-size="18">From modernization strategy to repeatable execution.</text>
    <g transform="translate(1028 38)">
      <rect width="112" height="40" rx="6" fill="#14253a" stroke="#41d9c4"/>
      <circle cx="22" cy="20" r="7" fill="#b9f35b" filter="url(#softGlow)"/>
      <text x="39" y="25" fill="#dceaf4" font-size="13" font-weight="700">BOOTCAMP</text>
    </g>
  </g>

  <g transform="translate(60 145)" font-family="Segoe UI, Arial, sans-serif">
    <text x="0" y="0" fill="#6f8ba4" font-size="13" font-weight="700" letter-spacing="1.5">THE MODERNIZATION CONTROL LOOP</text>

    <g transform="translate(0 27)">
      <rect width="1080" height="338" rx="8" fill="#101d2d" stroke="#2a3f57"/>
      <path d="M110 170 C230 32, 438 16, 540 92 C642 16, 850 32, 970 170 C850 308, 642 324, 540 248 C438 324, 230 308, 110 170Z" fill="none" stroke="#253e54" stroke-width="22" opacity="0.55"/>
      <path d="M110 170 C230 32, 438 16, 540 92 C642 16, 850 32, 970 170" fill="none" stroke="#41d9c4" stroke-width="3" marker-end="url(#cycleArrow)"/>
      <path d="M970 170 C850 308, 642 324, 540 248 C438 324, 230 308, 110 170" fill="none" stroke="#41d9c4" stroke-width="3" marker-end="url(#cycleArrow)"/>

      <g transform="translate(540 170)" text-anchor="middle">
        <circle r="92" fill="#0b1422" stroke="#41d9c4" stroke-width="2"/>
        <circle r="76" fill="none" stroke="#2a3f57"/>
        <circle r="61" fill="#14253a"/>
        <path d="M-31 -18L0 -36L31 -18V18L0 36L-31 18Z" fill="none" stroke="#41d9c4" stroke-width="2"/>
        <path d="M-31 -18L0 0L31 -18M0 0V36M-31 18L0 0L31 18" fill="none" stroke="#54718b" stroke-width="2"/>
        <circle cx="0" cy="-36" r="5" fill="#b9f35b" filter="url(#softGlow)"/>
        <circle cx="-31" cy="-18" r="5" fill="#62a7ff"/>
        <circle cx="31" cy="-18" r="5" fill="#ff7c67"/>
        <circle cx="-31" cy="18" r="5" fill="#d996ff"/>
        <circle cx="31" cy="18" r="5" fill="#41d9c4"/>
        <circle cx="0" cy="36" r="5" fill="#b9f35b"/>
        <circle r="8" fill="#f3f8fc"/>
      </g>

      <g transform="translate(110 170)" text-anchor="middle">
        <circle r="43" fill="#14253a" stroke="#41d9c4" stroke-width="2"/>
        <circle r="6" fill="#41d9c4" filter="url(#softGlow)"/>
        <text y="67" fill="#f3f8fc" font-size="15" font-weight="700">DISCOVER</text>
        <text y="87" fill="#8fa8bf" font-size="12">Context + evidence</text>
      </g>

      <g transform="translate(330 70)" text-anchor="middle">
        <circle r="43" fill="#14253a" stroke="#62a7ff" stroke-width="2"/>
        <path d="M-15 0L-4 11L17 -13" fill="none" stroke="#62a7ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <text y="67" fill="#f3f8fc" font-size="15" font-weight="700">DECIDE</text>
        <text y="87" fill="#8fa8bf" font-size="12">Strategy + target</text>
      </g>

      <g transform="translate(750 70)" text-anchor="middle">
        <circle r="43" fill="#14253a" stroke="#ff7c67" stroke-width="2"/>
        <path d="M-17 11L0 -17L17 11Z" fill="none" stroke="#ff7c67" stroke-width="4" stroke-linejoin="round"/>
        <path d="M-8 11V19H8V11" fill="none" stroke="#ff7c67" stroke-width="4"/>
        <text y="67" fill="#f3f8fc" font-size="15" font-weight="700">TRANSFORM</text>
        <text y="87" fill="#8fa8bf" font-size="12">App + data + platform</text>
      </g>

      <g transform="translate(970 170)" text-anchor="middle">
        <circle r="43" fill="#14253a" stroke="#b9f35b" stroke-width="2"/>
        <path d="M-18 2L-7 13L19 -14" fill="none" stroke="#b9f35b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <text y="67" fill="#f3f8fc" font-size="15" font-weight="700">VALIDATE</text>
        <text y="87" fill="#8fa8bf" font-size="12">Quality + operations</text>
      </g>

      <g transform="translate(540 274)" text-anchor="middle">
        <rect x="-76" y="-26" width="152" height="52" rx="6" fill="#14253a" stroke="#d996ff" stroke-width="2"/>
        <path d="M-46 7L-30 -9L-14 7L2 -9L18 7L34 -9L50 7" fill="none" stroke="#d996ff" stroke-width="3" stroke-linecap="round"/>
        <text x="0" y="51" fill="#f3f8fc" font-size="15" font-weight="700">SCALE</text>
        <text x="0" y="70" fill="#8fa8bf" font-size="12">Patterns + next waves</text>
      </g>
    </g>
  </g>

  <g transform="translate(60 546)" font-family="Segoe UI, Arial, sans-serif">
    <text x="0" y="0" fill="#6f8ba4" font-size="13" font-weight="700" letter-spacing="1.5">ARCHITECT ROLE</text>
    <text x="145" y="0" fill="#dceaf4" font-size="14">Frame outcomes</text>
    <circle cx="275" cy="-5" r="3" fill="#41d9c4"/>
    <text x="294" y="0" fill="#dceaf4" font-size="14">Challenge assumptions</text>
    <circle cx="456" cy="-5" r="3" fill="#41d9c4"/>
    <text x="475" y="0" fill="#dceaf4" font-size="14">Control risk</text>
    <circle cx="574" cy="-5" r="3" fill="#41d9c4"/>
    <text x="593" y="0" fill="#dceaf4" font-size="14">Validate evidence</text>
    <circle cx="736" cy="-5" r="3" fill="#41d9c4"/>
    <text x="755" y="0" fill="#dceaf4" font-size="14">Create repeatable decisions</text>
  </g>

  <g transform="translate(60 610)" font-family="Segoe UI, Arial, sans-serif">
    <g>
      <rect width="250" height="56" rx="6" fill="#14253a" stroke="#41d9c4"/>
      <rect width="6" height="56" rx="3" fill="#41d9c4"/>
      <text x="26" y="25" fill="#f3f8fc" font-size="15" font-weight="700">SECURE</text>
      <text x="26" y="43" fill="#8fa8bf" font-size="12">Identity + governance</text>
    </g>
    <g transform="translate(276 0)">
      <rect width="250" height="56" rx="6" fill="#14253a" stroke="#62a7ff"/>
      <rect width="6" height="56" rx="3" fill="#62a7ff"/>
      <text x="26" y="25" fill="#f3f8fc" font-size="15" font-weight="700">RESILIENT</text>
      <text x="26" y="43" fill="#8fa8bf" font-size="12">Continuity + reliability</text>
    </g>
    <g transform="translate(552 0)">
      <rect width="250" height="56" rx="6" fill="#14253a" stroke="#ff7c67"/>
      <rect width="6" height="56" rx="3" fill="#ff7c67"/>
      <text x="26" y="25" fill="#f3f8fc" font-size="15" font-weight="700">OBSERVABLE</text>
      <text x="26" y="43" fill="#8fa8bf" font-size="12">Telemetry + insight</text>
    </g>
    <g transform="translate(828 0)">
      <rect width="252" height="56" rx="6" fill="#14253a" stroke="#b9f35b"/>
      <rect width="6" height="56" rx="3" fill="#b9f35b"/>
      <text x="26" y="25" fill="#f3f8fc" font-size="15" font-weight="700">COST-AWARE</text>
      <text x="26" y="43" fill="#8fa8bf" font-size="12">FinOps + sustainable value</text>
    </g>
  </g>
</svg>
